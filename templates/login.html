{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if let Some(e) = error %}<p class="alert alert-error" role="alert">{{ e }}</p>{% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Username</label>
    <input id="username" name="username" value="{{ username }}" required autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button type="submit" class="btn btn-primary glow">Sign in</button>
  </form>
  <p class="muted"><a href="/register">No account? Request access.</a></p>
</section>
{% endblock %}
