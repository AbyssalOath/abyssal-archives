{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Create the administrator</h1>
  <p>This page only exists until the first account is created. There is no default password.</p>
  {% if let Some(e) = error %}<p class="alert alert-error" role="alert">{{ e }}</p>{% endif %}
  <form method="post" action="/setup" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Username</label>
    <input id="username" name="username" value="{{ username }}" required maxlength="64" pattern="[A-Za-z0-9._\-]+" autocomplete="username" autofocus>
    <label for="password">Password <span class="muted">(at least {{ min_len }} characters)</span></label>
    <input id="password" name="password" type="password" required minlength="{{ min_len }}" autocomplete="new-password">
    <label for="password_confirm">Repeat password</label>
    <input id="password_confirm" name="password_confirm" type="password" required minlength="{{ min_len }}" autocomplete="new-password">
    <button type="submit" class="btn btn-primary glow">Create administrator</button>
  </form>
</section>
{% endblock %}
