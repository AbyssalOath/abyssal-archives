{% extends "base.html" %}
{% block content %}
<h1>Change password</h1>
{% if done %}<p class="alert alert-ok" role="status">Password changed. All other sessions were signed out.</p>{% endif %}
{% if let Some(e) = error %}<p class="alert alert-error" role="alert">{{ e }}</p>{% endif %}
<section class="card narrow">
  <form method="post" action="{{ l.base() }}/password" class="form">
    <input type="hidden" name="csrf" value="{{ l.csrf() }}">
    <label for="current">Current password</label>
    <input id="current" name="current" type="password" required autocomplete="current-password">
    <label for="new">New password <span class="muted">(at least 12 characters)</span></label>
    <input id="new" name="new" type="password" required minlength="12" autocomplete="new-password">
    <label for="confirm">Repeat new password</label>
    <input id="confirm" name="confirm" type="password" required minlength="12" autocomplete="new-password">
    <button type="submit" class="btn btn-primary glow">Change password</button>
  </form>
</section>
{% endblock %}
