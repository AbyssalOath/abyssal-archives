{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Two-factor authentication</h1>
  <p>Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
  {% if let Some(e) = error %}<p class="alert alert-error" role="alert">{{ e }}</p>{% endif %}
  <form method="post" action="/login/2fa" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="code">Code</label>
    <input id="code" name="code" required maxlength="32" autocomplete="one-time-code" inputmode="text" autofocus>
    <button type="submit" class="btn btn-primary glow">Verify</button>
  </form>
</section>
{% endblock %}
