  <a href="{{ r.sha256sums_url }}">SHA256SUMS</a> · <a href="{{ r.sha512sums_url }}">SHA512SUMS</a>

  · <a href="{{ r.files_json_url }}">files.json</a>
  <span class="muted">· verify from the folder you downloaded into with</span> <code class="hash">{{ r.verify_hint }} --ignore-missing</code>
</p>
