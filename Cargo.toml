[package]
name = "filehost"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/AbyssalOath/abyssal-archives"

[dependencies]
aes-gcm = "0.11"
ammonia = "4.2.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
getrandom = "0.4"
hex = "0.4.3"
hmac = "0.13"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "server-graceful", "service", "http1", "http2"] }
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "socks"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls", "chrono", "migrate", "macros", "derive"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
