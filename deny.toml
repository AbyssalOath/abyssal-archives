# cargo-deny policy (CI: cargo deny check). https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Any RUSTSEC advisory (vulnerability, unsound, unmaintained-with-advisory)
# fails the build; add reviewed exceptions here with a reason.
ignore = []

[licenses]
# Permissive licenses only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # File-level copyleft, used unmodified as a dependency (cssparser and
    # dtoa-short, via ammonia): no obligations for this project's own code.
    "MPL-2.0",
]
confidence-threshold = 0.9
# This crate itself is not published (publish = false).
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
